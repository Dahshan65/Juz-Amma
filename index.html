<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مفردات جزء عم بالصور</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f3e9;color:#193b31;font-family:Tahoma,Arial,sans-serif}header{background:linear-gradient(120deg,#073d37,#0b6150);color:#fff;text-align:center;padding:30px 12px;border-bottom:5px solid #cba34c}header h1{margin:0 0 8px}header p{margin:0;color:#f5e7c0}main{max-width:1100px;margin:auto;padding:20px 14px}.panel{background:#fffdf7;border:1px solid #d8c18a;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 3px 15px #183d3112}h2{text-align:center;color:#08604b;margin-top:4px}.basmala{text-align:center;font:30px/2 serif;color:#13523d}.verses{font:clamp(23px,3vw,32px)/2.35 'Traditional Arabic','Amiri',serif;text-align:center;color:#163e32}.verse{display:inline}.num{color:#a77a28;font-size:.75em;padding:0 4px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{border:1px solid #d7c28c;border-radius:14px;overflow:hidden;background:white}.illustration{height:155px;display:grid;place-items:center;background:linear-gradient(145deg,#e4f1de,#f8ebcc);font-size:75px}.card .body{padding:15px}.card h3{color:#08604b;font-size:24px;margin:0 0 8px}.card p{line-height:1.8;margin:6px 0}.ref{color:#94722e;font-size:13px}footer{text-align:center;padding:22px;color:#5c6b60}button{border:0;background:#07503f;color:white;padding:10px 20px;border-radius:9px;cursor:pointer}nav{text-align:center;margin:15px}</style></head><body><header><h1>مفردات جزء عم بالصور</h1><p>نتعلم معاني الكلمات القرآنية الصعبة بالشرح والصورة</p></header><main><nav><button onclick="document.getElementById('words').scrollIntoView({behavior:'smooth'})">معاني المفردات</button></nav><section class="panel"><h2>سورة النبأ</h2><div class="basmala">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div><div class="verses" id="verses"></div></section><section class="panel" id="words"><h2>معاني المفردات الصعبة</h2><div class="cards" id="cards"></div></section></main><footer>إعداد وإشراف: وائل أحمد دهشان</footer><script>
const ayat=[
'عَمَّ يَتَسَاءَلُونَ','عَنِ النَّبَإِ الْعَظِيمِ','الَّذِي هُمْ فِيهِ مُخْتَلِفُونَ','كَلَّا سَيَعْلَمُونَ','ثُمَّ كَلَّا سَيَعْلَمُونَ','أَلَمْ نَجْعَلِ الْأَرْضَ مِهَادًا','وَالْجِبَالَ أَوْتَادًا','وَخَلَقْنَاكُمْ أَزْوَاجًا','وَجَعَلْنَا نَوْمَكُمْ سُبَاتًا','وَجَعَلْنَا اللَّيْلَ لِبَاسًا','وَجَعَلْنَا النَّهَارَ مَعَاشًا','وَبَنَيْنَا فَوْقَكُمْ سَبْعًا شِدَادًا','وَجَعَلْنَا سِرَاجًا وَهَّاجًا','وَأَنْزَلْنَا مِنَ الْمُعْصِرَاتِ مَاءً ثَجَّاجًا','لِنُخْرِجَ بِهِ حَبًّا وَنَبَاتًا','وَجَنَّاتٍ أَلْفَافًا','إِنَّ يَوْمَ الْفَصْلِ كَانَ مِيقَاتًا','يَوْمَ يُنْفَخُ فِي الصُّورِ فَتَأْتُونَ أَفْوَاجًا','وَفُتِحَتِ السَّمَاءُ فَكَانَتْ أَبْوَابًا','وَسُيِّرَتِ الْجِبَالُ فَكَانَتْ سَرَابًا','إِنَّ جَهَنَّمَ كَانَتْ مِرْصَادًا','لِلطَّاغِينَ مَآبًا','لَابِثِينَ فِيهَا أَحْقَابًا','لَا يَذُوقُونَ فِيهَا بَرْدًا وَلَا شَرَابًا','إِلَّا حَمِيمًا وَغَسَّاقًا','جَزَاءً وِفَاقًا','إِنَّهُمْ كَانُوا لَا يَرْجُونَ حِسَابًا','وَكَذَّبُوا بِآيَاتِنَا كِذَّابًا','وَكُلَّ شَيْءٍ أَحْصَيْنَاهُ كِتَابًا','فَذُوقُوا فَلَنْ نَزِيدَكُمْ إِلَّا عَذَابًا','إِنَّ لِلْمُتَّقِينَ مَفَازًا','حَدَائِقَ وَأَعْنَابًا','وَكَوَاعِبَ أَتْرَابًا','وَكَأْسًا دِهَاقًا','لَا يَسْمَعُونَ فِيهَا لَغْوًا وَلَا كِذَّابًا','جَزَاءً مِنْ رَبِّكَ عَطَاءً حِسَابًا','رَبِّ السَّمَاوَاتِ وَالْأَرْضِ وَمَا بَيْنَهُمَا الرَّحْمَٰنِ لَا يَمْلِكُونَ مِنْهُ خِطَابًا','يَوْمَ يَقُومُ الرُّوحُ وَالْمَلَائِكَةُ صَفًّا لَا يَتَكَلَّمُونَ إِلَّا مَنْ أَذِنَ لَهُ الرَّحْمَٰنُ وَقَالَ صَوَابًا','ذَٰلِكَ الْيَوْمُ الْحَقُّ فَمَنْ شَاءَ اتَّخَذَ إِلَىٰ رَبِّهِ مَآبًا','إِنَّا أَنْذَرْنَاكُمْ عَذَابًا قَرِيبًا يَوْمَ يَنْظُرُ الْمَرْءُ مَا قَدَّمَتْ يَدَاهُ وَيَقُولُ الْكَافِرُ يَا لَيْتَنِي كُنْتُ تُرَابًا'];
const words=[['النَّبَإِ','الخبر العظيم، والمقصود خبر البعث.','٢','📜'],['مِهَادًا','أرضًا ممهدة صالحة للاستقرار.','٦','🌿'],['أَوْتَادًا','تشبيه الجبال بالأوتاد المثبتة.','٧','⛰️'],['سُبَاتًا','راحةً وانقطاعًا عن العمل والتعب.','٩','😴'],['مَعَاشًا','وقتًا للسعي في أسباب العيش والرزق.','١١','🌾'],['سِرَاجًا وَهَّاجًا','الشمس المضيئة شديدة الحرارة.','١٣','☀️'],['الْمُعْصِرَاتِ','السحب المحملة بالمطر.','١٤','🌧️'],['ثَجَّاجًا','ماءً كثيرًا منصبًّا.','١٤','💧'],['أَلْفَافًا','بساتين ملتفة الأشجار.','١٦','🌳'],['مِيقَاتًا','موعدًا محددًا.','١٧','⏳'],['أَفْوَاجًا','جماعات متتابعة.','١٨','👥'],['سَرَابًا','شيئًا كأنه يُرى ولا حقيقة له.','٢٠','🏜️'],['مِرْصَادًا','موضع ترقب ورصد.','٢١','👁️'],['مَآبًا','مرجعًا ومصيرًا.','٢٢','↩️'],['أَحْقَابًا','أزمنة طويلة متتابعة.','٢٣','⌛'],['حَمِيمًا','ماءً بالغ الحرارة.','٢٥','♨️'],['غَسَّاقًا','شرابًا شديد الأذى والعذاب.','٢٥','⚠️'],['وِفَاقًا','جزاءً موافقًا لأعمالهم.','٢٦','⚖️'],['مَفَازًا','فوزًا ونجاةً.','٣١','🏆'],['أَتْرَابًا','متساويات في السن.','٣٣','👥'],['دِهَاقًا','مملوءة.','٣٤','🥛'],['لَغْوًا','كلامًا باطلًا لا فائدة فيه.','٣٥','💬']];
const eastern=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[Number(d)]);
document.getElementById('verses').innerHTML=ayat.map((a,i)=>`<span class="verse">${a} <span class="num">۝${eastern(i+1)}</span> </span>`).join('');
document.getElementById('cards').innerHTML=words.map(([w,m,n,emoji])=>`<article class="card"><div class="illustration" role="img" aria-label="رمز توضيحي لمعنى ${w}">${emoji}</div><div class="body"><h3>${w}</h3><p>${m}</p><div class="ref">الآية ${n}</div></div></article>`).join('');
</script></body></html>
